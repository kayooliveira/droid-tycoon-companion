server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Full default MIME map (http-level include is overridden if this server had a partial `types {}`).
    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* ^/fonts/.+\.ttf$ {
        default_type font/ttf;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* ^/fonts/.+\.otf$ {
        default_type font/otf;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* ^/fonts/.+\.woff2$ {
        default_type font/woff2;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* ^/fonts/.+\.woff$ {
        default_type font/woff;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
