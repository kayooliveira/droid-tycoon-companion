<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DroidDeck: visualizador de temas</title>
<style>body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#2b2b2e;color:#f4f4f4}header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:12px 16px;background:#1b1b1d}label{display:flex;flex-direction:column;font-size:12px;gap:4px;color:#bbb}select{font-size:16px;min-height:44px;padding:0 10px;background:#111;color:#fff;border:1px solid #555;border-radius:6px}main{display:flex;justify-content:center;padding:16px}iframe{width:390px;height:900px;border:0;background:#fff;box-shadow:0 0 0 1px #555}</style></head><body>
<header><label>Tema<select id="t"><option value="oficina">Oficina (padrão)</option><option value="figurinhas">Figurinhas</option><option value="cartaz">Cartaz</option></select></label>
<label>Modo<select id="m"><option value="system">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label>
<label>Tela<select id="s"><option value="inicio">Início</option><option value="skeleton-inicio">Início carregando</option><option value="progresso-foco">Progresso, Foco</option><option value="toast-desfazer">Toast com Desfazer</option><option value="progresso-lista">Progresso, Lista</option><option value="progresso-super">Progresso, Ciclo completo</option><option value="inventario-grade">Inventário, Grade</option><option value="inventario-lista">Inventário, Lista</option><option value="vender">Vender</option><option value="ciclos">Ciclos</option><option value="mais">Mais</option><option value="droiddex">Droiddex</option><option value="fusao">Fusão</option><option value="ajustes">Ajustes</option><option value="ajustes-aparencia">Ajustes, Aparência</option><option value="sheet-droid">Ficha do droid</option><option value="modal-super-renascimento">Modal: Super Renascimento</option><option value="modal-trocar-ciclo">Modal: Trocar ciclo</option><option value="modal-remover">Modal: Remover do inventário</option><option value="onb-1-boas-vindas">Onboarding 1: Boas-vindas</option><option value="onb-2-ciclo">Onboarding 2: Ciclo</option><option value="onb-3-progresso">Onboarding 3: Progresso</option><option value="onb-4-tema">Onboarding 4: Tema (novo)</option><option value="onb-5-pronto">Onboarding 5: Pronto</option><option value="vazio-inventario">Inventário vazio</option><option value="vazio-vender">Vender vazio</option><option value="skeleton-inventario">Inventário carregando</option><option value="componentes">Folha de componentes</option></select></label></header>
<main><iframe id="f" title="Pré-visualização"></iframe></main>
<script>const $=i=>document.getElementById(i);function go(){$('f').src='html/'+$('s').value+'.html?theme='+$('t').value+'&mode='+$('m').value}['t','m','s'].forEach(i=>$(i).addEventListener('change',go));
const q=new URLSearchParams(location.search);if(q.get('t'))$('t').value=q.get('t');if(q.get('m'))$('m').value=q.get('m');if(q.get('s'))$('s').value=q.get('s');go()</script></body></html>
