<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DroidDeck: visualizador de temas</title>
<style>body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#2b2b2e;color:#f4f4f4}header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:12px 16px;background:#1b1b1d}label{display:flex;flex-direction:column;font-size:12px;gap:4px;color:#bbb}select{font-size:16px;min-height:44px;padding:0 10px;background:#111;color:#fff;border:1px solid #555;border-radius:6px}main{display:flex;justify-content:center;padding:16px}iframe{width:390px;height:900px;border:0;background:#fff;box-shadow:0 0 0 1px #555}</style></head><body>
<header><label>Tema<select id="t"><option value="oficina">Oficina (padrão)</option><option value="figurinhas">Figurinhas</option><option value="cartaz">Cartaz</option></select></label>
<label>Modo<select id="m"><option value="system">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label>
<label>Tela<select id="s"><option value="inicio">Início</option><option value="skeleton-inicio">Início carregando</option><option value="toast-desfazer">Toast com Desfazer (adicionar no Progresso)</option><option value="progresso-super">Progresso, Ciclo completo</option><option value="inventario-grade">Inventário, Grade</option><option value="inventario-lista">Inventário, Lista</option><option value="vender">Vender</option><option value="ciclos">Ciclos</option><option value="mais">Mais (menu sobre a tab bar)</option><option value="droiddex">Droiddex</option><option value="fusao">Fusão</option><option value="ajustes">Ajustes (página completa)</option><option value="ajustes-aparencia">Ajustes, Aparência</option><option value="sheet-droid">Ficha do droid (Inventário)</option><option value="modal-super-renascimento">Modal: Super Renascimento</option><option value="modal-trocar-ciclo">Modal: Trocar de ciclo</option><option value="onb-1-boas-vindas">Onboarding 1: Boas-vindas</option><option value="onb-2-ciclo">Onboarding 2: Ciclo</option><option value="onb-3-progresso">Onboarding 3: Progresso</option><option value="onb-4-tema">Onboarding 4: Tema (novo)</option><option value="onb-5-pronto">Onboarding 5: O que você ganha</option><option value="vazio-inventario">Inventário vazio</option><option value="vazio-vender">Vender vazio</option><option value="skeleton-inventario">Inventário carregando</option><option value="componentes">Folha de componentes</option><option value="progresso">Progresso</option><option value="progresso-sem-inventario">Progresso sem registrar inventário</option><option value="progresso-disputa">Progresso, requisito disputado</option><option value="progresso-busca">Progresso, busca por droid</option><option value="progresso-busca-nunca">Progresso, busca: droid nunca necessário</option><option value="progresso-busca-vazia">Progresso, busca sem resultado</option><option value="modal-concluir-mesmo-assim">Modal: Concluir mesmo assim</option><option value="modal-desfazer-renascimento">Modal: Desfazer renascimento</option><option value="modal-trocar-ciclo-reset">Modal: Trocar de ciclo com reset</option><option value="inventario-filtro-raridade">Inventário, filtro por raridade</option><option value="inventario-filtro-nivel">Inventário, filtro por nível</option><option value="sheet-droid-progresso">Ficha do droid (a partir do Progresso)</option><option value="sheet-adicionar-droid">Sheet: Adicionar droid</option><option value="sheet-remover-inventario">Sheet: Remover do inventário</option><option value="inventario-toast-removido">Inventário, toast ao remover</option><option value="inventario-sem-rastreio">Inventário desligado</option><option value="inventario-sem-resultado">Inventário, filtro sem resultado</option><option value="ciclos-toast-pdf">Ciclos, PDF pronto (toast)</option><option value="droiddex-detalhe">Droiddex, detalhe do droid (modal)</option><option value="fusao-vazio">Fusão, sem receita na busca e nada para o próximo</option><option value="ajustes-dados-velhos">Ajustes, dados velhos</option><option value="modal-importar">Modal: Importar progresso</option><option value="modal-apagar-tudo">Modal: Apagar tudo</option><option value="toast-importar-erro">Ajustes, arquivo inválido (toast de erro)</option><option value="toast-card-erro">Ajustes, card não gerado (toast de erro)</option><option value="sobre">Sobre</option><option value="nao-encontrada">Página não encontrada</option><option value="banner-instalar">Banner: instalar o app (Android e desktop)</option><option value="banner-instalar-ios">Banner: instalar o app (iOS, instrução)</option><option value="toast-atualizacao-pwa">Toast: nova versão do app (fixo até agir)</option><option value="toasts-variantes">Toasts e avisos (todas as variantes)</option><option value="skeleton-pagina">Carregando página (fallback das rotas)</option></select></label></header>
<main><iframe id="f" title="Pré-visualização"></iframe></main>
<script>const $=i=>document.getElementById(i);function go(){$('f').src='html/'+$('s').value+'.html?theme='+$('t').value+'&mode='+$('m').value}['t','m','s'].forEach(i=>$(i).addEventListener('change',go));
const q=new URLSearchParams(location.search);if(q.get('t'))$('t').value=q.get('t');if(q.get('m'))$('m').value=q.get('m');if(q.get('s'))$('s').value=q.get('s');go()</script></body></html>
